    <!-- Title & Description -->
    <text x="50" y="170" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#111111" letter-spacing="-0.5px">Turkish E-Commerce Analyzer</text>
    <text x="50" y="205" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">Hybrid NLP engine using TF-IDF and Logistic Regression for Turkish</text>
    <text x="50" y="235" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">e-commerce reviews. Performs sentiment analysis, spam/bot detection</text>
    <text x="50" y="265" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">with Gradio web interface.</text>
