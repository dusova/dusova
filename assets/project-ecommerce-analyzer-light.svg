            <stop offset="0%" style="stop-color:#ffffff"/>
            <stop offset="100%" style="stop-color:#f2f2f7"/>
        </linearGradient>
        <clipPath id="projectClip">
            <rect width="800" height="420" rx="28"/>
        </clipPath>
    </defs>
    <g clip-path="url(#projectClip)">
        <rect width="800" height="420" rx="28" fill="url(#lightSurface)"/>
    </g>
    <rect x="0.5" y="0.5" width="799" height="419" rx="27.5" stroke="rgba(0,0,0,0.08)" fill="none"/>
    <!-- App Icon -->
    <rect x="50" y="50" width="72" height="72" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.05)"/>
    <g transform="translate(62, 62)">
