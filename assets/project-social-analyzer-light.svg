<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="lightSurface" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff"/>
            <stop offset="100%" style="stop-color:#f2f2f7"/>
        </linearGradient>
        <clipPath id="projectClip">
            <rect width="800" height="420" rx="28"/>
        </clipPath>
    </defs>
    <g clip-path="url(#projectClip)">
        <rect width="800" height="420" rx="28" fill="url(#lightSurface)"/>
    </g>
    <rect x="0.5" y="0.5" width="799" height="419" rx="27.5" stroke="rgba(0,0,0,0.08)" fill="none"/>
    <!-- App Icon -->
    <rect x="50" y="50" width="72" height="72" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.05)"/>
    <g transform="translate(64, 64)">
        <path d="M42.42 31.78A20 20 0 1 1 16 5.66" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M44 24A20 20 0 0 0 24 4v20z" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#111111" fill-opacity="0.1"/>
    </g>
    <!-- Title & Description -->
    <text x="50" y="170" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#111111" letter-spacing="-0.5px">Social Media Analyzer</text>
    <text x="50" y="205" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">SMATool - A CLI application that fetches data from Reddit</text>
    <text x="50" y="235" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">subreddits via APIs. Provides keyword analysis, sentiment</text>
    <text x="50" y="265" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">detection, and user statistics.</text>
    <!-- Badges -->
    <rect x="50" y="350" width="60" height="36" rx="8" fill="#EBEBF0" stroke="rgba(0,0,0,0.05)"/>
    <text x="80" y="374" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#333" text-anchor="middle">JAVA</text>
    <rect x="120" y="350" width="55" height="36" rx="8" fill="#EBEBF0" stroke="rgba(0,0,0,0.05)"/>
    <text x="147" y="374" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#333" text-anchor="middle">API</text>
    <rect x="185" y="350" width="50" height="36" rx="8" fill="#EBEBF0" stroke="rgba(0,0,0,0.05)"/>
    <text x="210" y="374" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#333" text-anchor="middle">CLI</text>
</svg>
