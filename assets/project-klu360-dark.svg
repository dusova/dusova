<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="darkSurface" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1c1c1e"/>
            <stop offset="100%" style="stop-color:#000000"/>
        </linearGradient>
        <clipPath id="projectClip">
            <rect width="800" height="420" rx="28"/>
        </clipPath>
    </defs>
    <g clip-path="url(#projectClip)">
        <rect width="800" height="420" rx="28" fill="url(#darkSurface)"/>
    </g>
    <rect x="0.5" y="0.5" width="799" height="419" rx="27.5" stroke="rgba(255,255,255,0.1)" fill="none"/>
    <!-- App Icon -->
    <rect x="50" y="50" width="72" height="72" rx="18" fill="#2c2c2e"/>
    <circle cx="86" cy="86" r="14" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <polygon points="82,80 92,86 82,92" fill="#ffffff"/>
    <!-- Title & Description -->
    <text x="50" y="170" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#f5f5f7" letter-spacing="-0.5px">KLU 360° Tour</text>
    <text x="50" y="205" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#86868b">360° virtual tour platform developed for Kırklareli University.</text>
    <text x="50" y="235" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#86868b">Features interactive panoramic views, multi-device support,</text>
    <text x="50" y="265" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#86868b">and rich navigation for exploring the campus.</text>
    <!-- Badges -->
    <rect x="50" y="350" width="60" height="36" rx="8" fill="#2C2C2E" stroke="rgba(255,255,255,0.08)"/>
    <text x="80" y="374" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ddd" text-anchor="middle">PHP</text>
    <rect x="120" y="350" width="100" height="36" rx="8" fill="#2C2C2E" stroke="rgba(255,255,255,0.08)"/>
    <text x="170" y="374" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ddd" text-anchor="middle">JAVASCRIPT</text>
    <rect x="230" y="350" width="70" height="36" rx="8" fill="#2C2C2E" stroke="rgba(255,255,255,0.08)"/>
    <text x="265" y="374" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ddd" text-anchor="middle">MYSQL</text>
</svg>
