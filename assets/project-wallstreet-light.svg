    <line x1="80" y1="104" x2="80" y2="83" stroke="#111111" stroke-width="2.5"/>
    <!-- Title & Description -->
    <text x="50" y="170" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#111111" letter-spacing="-0.5px">Wall Street Consulting LLC.</text>
    <text x="50" y="205" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">Comprehensive web platform for Wall Street Consulting.</text>
    <text x="50" y="235" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">Digitizes visa and immigration processes for USA &amp; Europe</text>
    <text x="50" y="265" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6e6e73">including residence and education services.</text>
