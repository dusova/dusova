    <rect x="120" y="350" width="100" height="36" rx="8" fill="#EBEBF0" stroke="rgba(0,0,0,0.05)"/>
    <text x="170" y="374" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#333" text-anchor="middle">JAVASCRIPT</text>
